map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream talktive_api {
  server 127.0.0.1:8080;
  keepalive 32;
}

upstream talktive_web {
  server 127.0.0.1:8082;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.talktive.app;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.talktive.app;

  ssl_certificate /etc/letsencrypt/live/api.talktive.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.talktive.app/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location = /health {
    proxy_pass http://talktive_api;
  }

  location = /websocket {
    proxy_pass http://talktive_api;
  }

  location = /v1/websocket {
    proxy_pass http://talktive_api;
  }

  location / {
    proxy_pass http://talktive_api;
  }

  location /app/ {
    proxy_pass http://talktive_web;
  }
}
