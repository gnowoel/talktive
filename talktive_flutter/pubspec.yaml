name: talktive
description: 'A simple anonymous group chat app'
publish_to: 'none'
version: 4.7.0+78

environment:
  sdk: ^3.8.0

dependencies:
  talktive_client:
    path: ../talktive_client
  serverpod_flutter: ^3.3.1
  serverpod_auth_core_flutter: ^3.3.1
  # serverpod_auth_idp_flutter: ^3.2.1
  serverpod_auth_google_flutter: ^3.3.1 # Keep for now if needed by firebase_flutter? No, firebase_flutter uses firebase_auth.
  # serverpod_auth_google_flutter: ^3.2.3 # Removed
  # serverpod_auth_apple_flutter: ^3.2.3 # Unused
  # serverpod_auth_email_flutter: ^3.2.3 # Unused
  async: ^2.11.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.0.4
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_database: ^12.1.0
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.0.0
  go_router: ^17.1.0
  google_mobile_ads: ^6.0.0
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  timeago: ^3.6.1
  unicode_emojis: ^0.5.1
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.2
  emoji_picker_flutter: ^4.4.0
  country_picker: ^2.0.27
  confetti: ^0.8.0
  google_fonts: ^7.1.0
  flutter_riverpod: ^3.1.0
  intl: ^0.19.0
  riverpod_annotation: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  firebase_auth_mocks: ^0.15.1
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.11.0
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/config.json

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter_launcher_icons:
  image_path: 'assets/images/icon-1024x1024-big.png'
  android: true
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/images/icon-1024x1024-small.png'
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: 'assets/images/icon-1024x1024-big.png'
    background_color: '#FFFFFF'
    theme_color: '#FFFFFF'
