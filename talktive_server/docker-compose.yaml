services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: talktive
      POSTGRES_PASSWORD: "KPriBB5F68Kvzuy04BeAwqnyVAQKvkq3"
    volumes:
      - talktive_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "EmYS0PWGKjCXDQpCZD-q6oPPRb13v3Os"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: talktive_test
      POSTGRES_PASSWORD: "cA8L6tRRuzzdqw5O-Pv8yGnkluMaRfMm"
    volumes:
      - talktive_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "s3Wnio83ilPk6yiaDElfK52U7-osDNtQ"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  talktive_data:
  talktive_test_data:
