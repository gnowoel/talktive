class: ChannelMember
table: channel_member
fields:
  channelId: int
  userInfoId: UuidValue
  joinedAt: DateTime
  role: String?
  status: ChannelMemberStatus
  invitedBy: UuidValue?
  isMuted: bool, default=false
  lastReadAt: DateTime, default=now
indexes:
  channel_user_idx:
    fields: channelId, userInfoId
    unique: true
  channel_member_user_idx:
    fields: userInfoId
