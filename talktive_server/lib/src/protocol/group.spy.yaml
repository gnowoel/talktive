class: Group
table: groups
fields:
  channelId: int
  name: String
  description: String?
  emoji: String?
  creatorId: UuidValue
  createdAt: DateTime
  memberCount: int, default=1
  isPublic: bool, default=false
  maxMembers: int, default=50
  lastMessageAt: DateTime?
  lastMessage: String?
  interests: List<String>?
  isAdminLocked: bool, default=false
indexes:
  group_channel_idx:
    fields: channelId
    unique: true
  group_creator_idx:
    fields: creatorId
