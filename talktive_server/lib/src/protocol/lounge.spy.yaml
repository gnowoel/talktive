class: Lounge
table: lounge
fields:
  channelId: int
  name: String
  description: String?
  emoji: String?
  creatorId: UuidValue
  createdAt: DateTime
  memberCount: int, default=1
  isPublic: bool, default=false
  maxMembers: int, default=50
  lastMessageAt: DateTime?
  lastMessage: String?
  interests: List<String>?
  isStaffLocked: bool, default=false
indexes:
  lounge_channel_idx:
    fields: channelId
    unique: true
  lounge_creator_idx:
    fields: creatorId
