class: Lounge
table: lounge
fields:
  channelId: int
  name: String
  description: String?
  emoji: String?
  creatorId: UuidValue
  createdAt: DateTime
  memberCount: int, default=1
  isPublic: bool, default=true
  maxMembers: int, default=50
  lastMessageAt: DateTime?
  lastMessage: String?
  interests: List<String>?
  languages: List<String>?
  country: String?
  rules: String?
  level: int, default=1
  xp: int, default=0
  isStaffLocked: bool, default=false
indexes:
  lounge_channel_idx:
    fields: channelId
    unique: true
  lounge_creator_idx:
    fields: creatorId
  lounge_active_idx:
    fields: isPublic, isStaffLocked, lastMessageAt
  lounge_member_idx:
    fields: memberCount
  lounge_lastmsg_idx:
    fields: lastMessageAt
