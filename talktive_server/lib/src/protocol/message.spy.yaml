class: Message
table: message
fields:
  channelId: int
  senderId: UuidValue
  content: String?
  imageUrl: String?
  createdAt: DateTime

  # Denormalized Sender Info
  senderName: String
  senderAvatar: String?
  senderMood: String?
  senderFloor: int
indexes:
  message_channel_idx:
    fields: channelId
  message_sender_idx:
    fields: senderId
  message_created_idx:
    fields: createdAt
  message_channel_created_idx:
    fields: channelId, createdAt
