class: Message
table: message
fields:
  channelId: int
  senderId: UuidValue
  content: String?
  imageUrl: String?
  mediaUrl: String?
  mediaType: String?
  isSystem: bool
  isPinned: bool, default=false
  pinnedAt: DateTime?
  createdAt: DateTime
  duration: int?
  fileSize: int?
  isRecalled: bool, default=false
  recalledAt: DateTime?

  # Denormalized Sender Info
  senderName: String
  senderAvatar: String?
  senderMood: String?
  senderFloor: int
  senderTrustScore: int
indexes:
  message_channel_idx:
    fields: channelId
  message_sender_idx:
    fields: senderId
  message_created_idx:
    fields: createdAt
  message_channel_created_idx:
    fields: channelId, createdAt
