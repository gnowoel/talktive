class: MomentComment
table: moment_comments
fields:
  momentId: int
  userId: UuidValue
  text: String
  createdAt: DateTime

  # Denormalized User Info
  userName: String
  userAvatar: String?
  userMood: String?
  userFloor: int
  userTrustScore: int


indexes:
  moment_comment_created_idx:
    fields: momentId, createdAt
