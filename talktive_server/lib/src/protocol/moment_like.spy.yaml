class: MomentLike
table: moment_likes
fields:
  momentId: int
  userId: UuidValue
  createdAt: DateTime

  # Denormalized User Info
  userName: String
  userAvatar: String?
  userMood: String?
  userFloor: int
  userTrustScore: int


indexes:
  moment_user_unique:
    fields: momentId, userId
    unique: true
