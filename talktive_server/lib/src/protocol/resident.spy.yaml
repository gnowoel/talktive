class: Resident
table: resident
fields:
  userInfoId: UuidValue
  createdAt: DateTime?

  # Safety System
  trustScore: int, default=100
  lastReputationIncrease: DateTime?
  mutedUntil: DateTime?
  suspended: bool, default=false

  # Gamification System
  xp: int, default=0
  level: int, default=0
  currentStreak: int, default=0
  longestStreak: int, default=0
  lastLoginDate: DateTime?
  lastMessageDate: DateTime?


  # Profile
  userName: String?
  gender: String?
  country: String?
  bio: String?
  mood: String?
  avatar: String?
  ageRange: String?, default='18-24'
  interests: List<String>?
  languages: List<String>?

  # Admin
  role: ResidentRole, default=user

  # Online & Subscription
  lastSeen: DateTime?
  isPremium: bool, default=false
  premiumTrialExpires: DateTime?
  trialCount: int, default=0

  # Premium Inbound Settings (Controls what the user sees)
  showOthersOnlineStatus: bool, default=true
  showOthersReadReceipts: bool, default=true
  showOthersTypingIndicators: bool, default=true

  # Premium Feature Toggles
  hideAds: bool, default=false
  showVoiceMessages: bool, default=true
  showAdvancedDiscovery: bool, default=true
  showCustomAvatar: bool, default=true
  keepPrivateChats: bool, default=true

  customAvatarUrl: String?

  # Global Notification Setting
  allowPushNotifications: bool, default=true

indexes:
  resident_user_idx:
    fields: userInfoId
    unique: true
  resident_lastseen_idx:
    fields: lastSeen
  resident_search_idx:
    fields: userName
    type: gin
  resident_interests_idx:
    fields: interests
    type: gin
  resident_languages_idx:
    fields: languages
    type: gin
  resident_metadata_idx:
    fields: gender, country, role
  resident_msg_date_idx:
    fields: lastMessageDate
  resident_geo_idx:
    fields: country, gender, ageRange
  resident_xp_idx:
    fields: xp
  resident_level_idx:
    fields: level
  resident_role_idx:
    fields: role
