class: Resident
table: resident
fields:
  userInfoId: UuidValue
  createdAt: DateTime?
  
  # Safety System
  trustScore: int, default=100
  lastReputationIncrease: DateTime?
  mutedUntil: DateTime?
  suspended: bool, default=false
  
  # Gamification System
  xp: int, default=0
  level: int, default=0
  # NOTE: 'reputation' is now the computed aggregate (formerly known as floor).
  #   reputation = min(level, trustCap(trustScore), socialCap(likeCount))
  # See: ReputationService.computeEffectiveFloor()
  currentStreak: int, default=0
  longestStreak: int, default=0
  lastLoginDate: DateTime?
  lastMessageDate: DateTime?
  
  # Legacy (keep for achievements tracking)
  experienceMessageCount: int, default=0
  
  # Profile
  userName: String?
  gender: String?
  country: String?
  bio: String?
  mood: String?
  avatar: String?
  interests: List<String>?
  languages: List<String>?
  
  # Admin
  role: ResidentRole, default=user
  
  # Online & Subscription
  lastSeen: DateTime?
  isPremium: bool, default=false
  showOnlineStatus: bool, default=true
  showReadReceipts: bool, default=true
  showTypingIndicator: bool, default=true
  customAvatarUrl: String?
  
indexes:
  resident_user_idx:
    fields: userInfoId
    unique: true
