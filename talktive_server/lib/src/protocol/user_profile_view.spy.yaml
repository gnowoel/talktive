### User profile view data
class: UserProfileView
fields:
  userId: UuidValue
  userName: String?
  userAvatar: String?
  userMood: String?
  floor: int
  trustScore: int
  totalMessages: int
  totalMoments: int
  achievementsUnlocked: int
  currentStreak: int
  longestStreak: int
  isBlocked: bool
  hasBlockedMe: bool
  isLiked: bool
  mutualLounges: int
  recentMoments: List<Moment>?
  level: int?
  xp: int?
  interests: List<String>?
  languages: List<String>?
  gender: String?
  country: String?
  bio: String?
  ageRange: String?
  lastSeen: DateTime?
  isOnline: bool, default=false
  isPremium: bool, default=false
  role: ResidentRole
  topAchievements: List<UserAchievementView>?
