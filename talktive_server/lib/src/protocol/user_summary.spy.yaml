### Simplified user data for lists and search
class: UserSummary
fields:
  userId: UuidValue
  userName: String?
  userAvatar: String?
  userMood: String?
  userBio: String?
  floor: int
  trustScore: int?
  sharedInterests: List<String>?
  sharedLanguages: List<String>?
  matchScore: int?
  ageRange: String?
  gender: String?
  languages: List<String>?
  isOnline: bool, default=false
  role: ResidentRole?
